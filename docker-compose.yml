version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rhythm-backend
    ports:
      - "5000:5000"
    environment:
      # Force backend to listen on 5000 instead of 3000 (which is your root .env default)
      - PORT=5000
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Tell the React app to send API and Socket requests to the backend on port 5000
        - VITE_API_URL=http://localhost:5000
        - VITE_SOCKET_URL=http://localhost:5000
    container_name: rhythm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
